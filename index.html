    function Icon({ name, size = 16, className = "" }) {
      const [svgContent, setSvgContent] = useState("");
      
      useEffect(() => {
        if (!name) return;
        if (window.lucide && window.lucide.icons) {
          const camelName = name.charAt(0).toLowerCase() + name.slice(1);
          const icon = window.lucide.icons[camelName] || window.lucide.icons[name];
          
          if (icon) {
            const children = icon[2] || [];
            let childrenHtml = "";
            children.forEach(child => {
              const childName = child[0];
              const childAttrs = child[1];
              const attrsStr = Object.entries(childAttrs)
                .map(([k, v]) => `${k}="${v}"`)
                .join(" ");
              childrenHtml += `<${childName} ${attrsStr}></${childName}>`;
            });
            setSvgContent(childrenHtml);
          }
        }
      }, [name]);

      if (!name) return null;

      if (!svgContent) {
        return <span style={{ width: size, height: size }} className={"inline-block " + className}></span>;
      }

      return (
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width={size}
          height={size}
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          strokeWidth="2.2"
          strokeLinecap="round"
          strokeLinejoin="round"
          className={"lucide inline-block " + className}
          dangerouslySetInnerHTML={{ __html: svgContent }}

      const [sheet, setSheet] = useState({ isOpen: false, type: '', data: null });
      const [modal, setModal] = useState({ isOpen: false, title: '', message: '', onConfirm: null });

      // 持久化
      useEffect(() => { localStorage.setItem('cofi_accounts', JSON.stringify(accounts)); }, [accounts]);
      useEffect(() => { localStorage.setItem('cofi_stocks', JSON.stringify(stocks)); }, [stocks]);
      useEffect(() => { localStorage.setItem('cofi_batches', JSON.stringify(batches)); }, [batches]);
      useEffect(() => { localStorage.setItem('cofi_orders', JSON.stringify(orders)); }, [orders]);
      useEffect(() => { localStorage.setItem('cofi_transactions', JSON.stringify(transactions)); }, [transactions]);

      // 一次性資料移轉（自動過濾舊版 April/May 模擬數據）
      useEffect(() => {
        const migrated = localStorage.getItem('cofi_mock_migrated_v6');
        if (!migrated) {
          setBatches(prev => {
            const filtered = prev.filter(b => b.id !== 'b1' && b.id !== 'b2');
            if (filtered.length === 0) {
              return [{ id: 'b_default', name: '2026/06 代購開團', active: true }];
            }
            return filtered;
          });
          setOrders(prev => prev.filter(o => o.batchId !== 'b1' && o.batchId !== 'b2' && o.id !== 'o1' && o.id !== 'o2' && o.id !== 'o3' && o.id !== 'o4' && o.id !== 'o5'));
          setSelectedBatchId(prev => {
            if (prev === 'b1' || prev === 'b2') {
              return 'b_default';
            }
            return prev;
          });
          localStorage.setItem('cofi_mock_migrated_v6', 'true');
        }
      }, []);

      const showToast = (message, type = 'success') => {
        const id = Date.now() + Math.random().toString(36).substring(2, 5);
        setToasts(prev => [...prev, { id, message, type }]);
        setTimeout(() => {
          setToasts(prev => prev.filter(t => t.id !== id));
        }, 3000);
      };

      const removeToast = (id) => {
        setToasts(prev => prev.filter(t => t.id !== id));
      };

      // 統計加總
      const cashTotals = useMemo(() => {
        let bu = 0, chu = 0;
        accounts.forEach(a => {
          const rate = exchangeRates[a.currency || 'TWD'] || 1.0;
          const balanceInTWD = a.balance * rate;
          if (a.owner === 'Bu') bu += balanceInTWD;
          if (a.owner === 'Chu') chu += balanceInTWD;
        });
        return { bu, chu, total: bu + chu };
      }, [accounts, exchangeRates]);

      const stockTotals = useMemo(() => {
        let bu = 0, chu = 0, totalCost = 0, totalValue = 0;
        stocks.forEach(s => {
          const cost = s.shares * s.avgCost;
          const val = s.shares * s.currentPrice;
          totalCost += cost;
          totalValue += val;
          if (s.owner === 'Bu') bu += val;
          if (s.owner === 'Chu') chu += val;
        });
        const profit = totalValue - totalCost;
        return { bu, chu, total: totalValue, profit, profitPercent: totalCost > 0 ? (profit / totalCost) * 100 : 0 };
      }, [stocks]);

      const sideHustleStats = useMemo(() => {
        const activeOrders = orders.filter(o => o.batchId === selectedBatchId);
        
        let activeCost = 0;
        let activeSales = 0;
        let activeProfit = 0;

        activeOrders.forEach(o => {
          const q = o.quantity || 1;
          const uCost = o.unitCost || o.cost;
          const uPrice = o.unitPrice || o.price;
          const costRate = exchangeRates[o.costCurrency || 'TWD'] || 1.0;
          const priceRate = exchangeRates[o.priceCurrency || 'TWD'] || 1.0;

          activeCost += uCost * q * costRate;
          activeSales += uPrice * q * priceRate;
          activeProfit += (uPrice * priceRate - uCost * costRate) * q;
        });

        const thisMonthOrders = (orders || []).filter(o => o && o.date && typeof o.date === 'string' && o.date.indexOf('2026-05') === 0);
        const thisMonthSideHustleProfit = thisMonthOrders.reduce((sum, o) => {
          const q = o.quantity || 1;
          const uCost = o.unitCost || o.cost;
          const uPrice = o.unitPrice || o.price;
          const costRate = exchangeRates[o.costCurrency || 'TWD'] || 1.0;
          const priceRate = exchangeRates[o.priceCurrency || 'TWD'] || 1.0;
          const orderProfitTWD = (uPrice * priceRate - uCost * costRate) * q;
          return sum + orderProfitTWD;
        }, 0);

        return {
          activeCost, activeSales, activeProfit,
          thisMonthSideHustleProfit,
          orderCount: activeOrders.length
        };
      }, [orders, selectedBatchId, exchangeRates]);

      const cashflowStats = useMemo(() => {
        const thisMonthTx = (transactions || []).filter(t => t && t.date && typeof t.date === 'string' && t.date.indexOf('2026-05') === 0);
        const income = thisMonthTx.filter(t => t.type === 'income').reduce((sum, t) => {
          const rate = exchangeRates[t.currency || 'TWD'] || 1.0;
          return sum + (t.amount * rate);
        }, 0);
        const expense = thisMonthTx.filter(t => t.type === 'expense').reduce((sum, t) => {
          const rate = exchangeRates[t.currency || 'TWD'] || 1.0;
          return sum + (t.amount * rate);
        }, 0);
        return { income, expense, net: income - expense };
      }, [transactions, exchangeRates]);

      const familyTotalAssets = cashTotals.total + stockTotals.total + sideHustleStats.activeProfit;
      const familyMonthProfit = cashflowStats.net + sideHustleStats.thisMonthSideHustleProfit;

      const assetDistribution = useMemo(() => {
        const buCash = cashTotals.bu;
        const chuCash = cashTotals.chu;
        const stockVal = stockTotals.total;
        const sideHustleRoll = sideHustleStats.activeProfit;
        const sum = buCash + chuCash + stockVal + sideHustleRoll;
        if (sum === 0) return { buCashPct: 0, chuCashPct: 0, stockPct: 0, hustlePct: 0 };
        return {
          buCashPct: (buCash / sum) * 100,
          chuCashPct: (chuCash / sum) * 100,
          stockPct: (stockVal / sum) * 100,
          hustlePct: (sideHustleRoll / sum) * 100,
          buCash, chuCash, stockVal, sideHustleRoll
        };
      }, [cashTotals, stockTotals, sideHustleStats.activeProfit]);

      const toggleOrderStatus = (orderId) => {
        const cycle = ['待買項目', '已買項目', '已出貨'];
        setOrders(prev => prev.map(o => {
          if (o.id === orderId) {
            const nextIdx = (cycle.indexOf(o.status) + 1) % cycle.length;
            const nextStatus = cycle[nextIdx];
            showToast("訂單「" + o.client + "」已更新為 " + nextStatus + "!", 'info');
            return Object.assign({}, o, { status: nextStatus });
          }
          return o;
        }));
      };

      const simulateGoogleFormImport = () => {
        const randomGood = SIMULATED_GOODS[Math.floor(Math.random() * SIMULATED_GOODS.length)];
        const randomClient = SIMULATED_CLIENTS[Math.floor(Math.random() * SIMULATED_CLIENTS.length)];
        const quantity = Math.floor(Math.random() * 3) + 1;
        
        // 智慧隨機：如果是堅果/開心果，進貨價在越南買所以是越南盾 (VND)，售價是台幣 (TWD)
        const isVndCost = randomGood.item.indexOf('開心果') !== -1 || randomGood.item.indexOf('腰果') !== -1 || Math.random() > 0.5;
        const costCurrency = isVndCost ? 'VND' : 'TWD';
        const priceCurrency = 'TWD';
        
        // 越南盾金額大概是台幣進價的 750 倍，取個整數
        const unitCost = isVndCost ? Math.round((randomGood.cost * 750) / 1000) * 1000 : randomGood.cost;
        const unitPrice = randomGood.price;
        
        const costRate = exchangeRates[costCurrency] || 1.0;
        const priceRate = exchangeRates[priceCurrency] || 1.0;
        
        const costTWD = unitCost * quantity * costRate;
        const priceTWD = unitPrice * quantity * priceRate;
        
        const newOrder = {
          id: 'o_g_' + Date.now(),
          date: new Date().toISOString().split('T')[0],
          client: randomClient,
          channel: 'Google表單',
          item: randomGood.item,
          unitCost,
          unitPrice,
          quantity,
          costCurrency,
          priceCurrency,
          cost: unitCost * quantity,
          price: unitPrice * quantity,
          profit: priceTWD - costTWD,
          status: '待買項目',
          batchId: selectedBatchId
        };
        setOrders(prev => [newOrder, ...prev]);
        showToast("📥 堅果表單自動匯入成功！" + randomClient + " 訂購了 " + randomGood.item + " x " + quantity + " 件", 'success');
      };

      const triggerStockPriceUpdate = () => {
        setIsUpdatingStock(true);
        setTimeout(() => {
          setStocks(prev => prev.map(s => {
            const change = (Math.random() * 7 - 2.5) / 100;
            return Object.assign({}, s, { currentPrice: Math.round((s.currentPrice * (1 + change)) * 100) / 100 });
          }));
          setIsUpdatingStock(false);
          showToast('📈 證券即時行情更新完成！', 'success');
        }, 800);
      };

      const getFuzzyPriceMatches = (query) => {
        if (!query || query.trim().length < 1) return [];
        const matched = [];
        const seen = new Set();
        orders.forEach(o => {
          const cleanItem = o.item.split(' x ')[0];
          if (cleanItem.toLowerCase().indexOf(query.toLowerCase()) !== -1 && !seen.has(cleanItem)) {
            seen.add(cleanItem);
            const qty = o.quantity || 1;
            const uCost = o.unitCost || Math.round(o.cost / qty);
            const uPrice = o.unitPrice || Math.round(o.price / qty);
            matched.push({
              item: cleanItem,
              unitCost: uCost,
              unitPrice: uPrice,
              costCurrency: o.costCurrency || 'VND',
              priceCurrency: o.priceCurrency || 'TWD'
            });
          }
        });
        return matched.slice(0, 3);
      };

      const openConfirmModal = (title, message, onConfirm) => {
        setModal({ isOpen: true, title, message, onConfirm });
      };

      const handleOrderDelete = (id) => {
        openConfirmModal('確認刪除訂單？', '此動作將影響本期盈餘計算。', () => {
          setOrders(prev => prev.filter(o => o.id !== id));
          setModal({ isOpen: false, title: '', message: '', onConfirm: null });
          showToast('訂單已刪除', 'info');
        });
      };

      const handleTransactionDelete = (id) => {
        openConfirmModal('確認刪除記帳紀錄？', '這會從本月家庭收支中移除。', () => {
          setTransactions(prev => prev.filter(t => t.id !== id));
          setModal({ isOpen: false, title: '', message: '', onConfirm: null });
          showToast('記帳紀錄已刪除', 'info');
        });
      };

      const handleStockDelete = (id) => {
        openConfirmModal('確認刪除此持股？', '這會將其自您的持股列表中移除。', () => {
          setStocks(prev => prev.filter(s => s.id !== id));
          setModal({ isOpen: false, title: '', message: '', onConfirm: null });
          showToast('持股已移除', 'info');
        });
      };

      const handleAccountDelete = (id) => {
        openConfirmModal('確認刪除此帳戶？', '這會將此帳戶自餘額盤點列表中移除，但不會影響已錄入的歷史流水帳目。', () => {
          setAccounts(prev => prev.filter(a => a.id !== id));
          setModal({ isOpen: false, title: '', message: '', onConfirm: null });
          setSheet({ isOpen: false, type: '', data: null });
          showToast('帳戶已成功移除', 'info');
        });
      };

      const handleClearOrders = () => {
        setOrders([]);
        showToast('🧹 已成功清空「好物推推」所有模擬訂單！', 'info');
        setSheet({ isOpen: false, type: '', data: null });
      };

      const handleClearTransactions = () => {
        setTransactions([]);
        showToast('🧹 已成功清空所有日常收支流水明細！', 'info');
        setSheet({ isOpen: false, type: '', data: null });
      };

      // Excel 數據寫入合併
      const handleExcelImport = (importedList) => {
        if (importedList.length === 0) {
          showToast('⚠️ 解析無效，請檢查 Excel 資料格式。', 'error');
          return;
        }
        setTransactions(prev => [...importedList, ...prev]);
        showToast("🎉 成功從 Excel 匯入 " + importedList.length + " 筆歷史收支！", 'success');
      };

      const handleSheetSubmit = (e, formData) => {
        e.preventDefault();
        const { type, data } = sheet;

        if (type === 'reconcile') {
          const bal = parseFloat(formData.balance);
          setAccounts(prev => prev.map(a => a.id === data.id ? Object.assign({}, a, { name: formData.name, owner: formData.owner, balance: bal, currency: formData.currency }) : a));
          showToast("帳戶資料與餘額已校準！", 'success');
        } else if (type === 'addAccount') {
          const bal = parseFloat(formData.balance) || 0;
          const newAcc = {
            id: 'a_' + Date.now(),
            name: formData.name,
            balance: bal,
            owner: formData.owner,
            currency: formData.currency || 'TWD'
          };
          setAccounts(prev => [...prev, newAcc]);
          showToast("🏦 實體帳戶「" + formData.name + "」已成功加入！", 'success');
        } else if (type === 'addOrder') {
          const uCost = parseFloat(formData.unitCost) || 0;
          const uPrice = parseFloat(formData.unitPrice) || 0;
          const q = parseInt(formData.quantity, 10) || 1;
          const costCurr = formData.costCurrency || 'VND';
          const priceCurr = formData.priceCurrency || 'TWD';
          
          const costRate = exchangeRates[costCurr] || 1.0;
          const priceRate = exchangeRates[priceCurr] || 1.0;
          
          const newOrder = {
            id: 'o_m_' + Date.now(),
            date: formData.date || new Date().toISOString().split('T')[0],
            client: formData.client || '手動IG買家',
            channel: 'IG手動',
            item: formData.item,
            unitCost: uCost,
            unitPrice: uPrice,
            quantity: q,
            costCurrency: costCurr,
            priceCurrency: priceCurr,
            cost: uCost * q,
            price: uPrice * q,
            profit: (uPrice * priceRate - uCost * costRate) * q,
            status: '待買項目',
            batchId: selectedBatchId
          };
          setOrders(prev => [newOrder, ...prev]);
          showToast("🛍️ IG 訂單登錄成功！", 'success');
        } else if (type === 'editOrder') {
          const uCost = parseFloat(formData.unitCost) || 0;
          const uPrice = parseFloat(formData.unitPrice) || 0;
          const q = parseInt(formData.quantity, 10) || 1;
          const costCurr = formData.costCurrency || 'VND';
          const priceCurr = formData.priceCurrency || 'TWD';
          
          const costRate = exchangeRates[costCurr] || 1.0;
          const priceRate = exchangeRates[priceCurr] || 1.0;
          
          setOrders(prev => prev.map(o => o.id === data.id ? Object.assign({}, o, {
            date: formData.date,
            client: formData.client,
            item: formData.item,
            unitCost: uCost,
            unitPrice: uPrice,
            quantity: q,
            costCurrency: costCurr,
            priceCurrency: priceCurr,
            cost: uCost * q,
            price: uPrice * q,
            profit: (uPrice * priceRate - uCost * costRate) * q
          }) : o));
          showToast("🛍️ 訂單資料已成功更新！", 'success');
        } else if (type === 'addTransaction') {
          const amt = parseFloat(formData.amount) || 0;
          const newTx = {
            id: 't_' + Date.now(),
            date: formData.date || new Date().toISOString().split('T')[0],
            type: formData.txType,
            amount: amt,
            currency: formData.currency || 'TWD',
            category: formData.category,
            owner: formData.owner,
            desc: formData.desc || ''
          };
          setTransactions(prev => [newTx, ...prev]);
          showToast("🏦 收支帳登錄成功！", 'success');
        } else if (type === 'addStock') {
          const shs = parseInt(formData.shares, 10) || 0;
          const cst = parseFloat(formData.avgCost) || 0;
          const cur = parseFloat(formData.currentPrice) || cst;
          const newStk = {
            id: 's_' + Date.now(),
            symbol: formData.symbol.toUpperCase(),
            name: formData.name || formData.symbol.toUpperCase(),
            shares: shs, avgCost: cst, currentPrice: cur,
            owner: formData.owner
          };
          setStocks(prev => [...prev, newStk]);
          showToast("📈 " + newStk.symbol + " 已加入持股組合！", 'success');
        } else if (type === 'addBatch') {
          const newBatchId = 'b_' + Date.now();
          const newBatch = {
            id: newBatchId,
            name: formData.name,
            active: formData.active
          };
          setBatches(prev => {
            let updated = prev;
            if (formData.active) {
              updated = prev.map(b => Object.assign({}, b, { active: false }));
            }
            return [...updated, newBatch];
          });
          if (formData.active) {
            setSelectedBatchId(newBatchId);
          }
          showToast("🛍️ 團購檔期「" + formData.name + "」已成功建立！", 'success');
        }

        setSheet({ isOpen: false, type: '', data: null });
      };

      return (
        <div className="relative mx-auto w-full max-w-[395px] h-[852px] sm:h-[844px] rounded-[52px] border-[12px] border-zinc-800 bg-zinc-950 shadow-[0_25px_60px_-15px_rgba(0,0,0,0.95)] ring-[4px] ring-zinc-700/20 overflow-hidden flex flex-col max-sm:h-screen max-sm:w-full max-sm:max-w-none max-sm:rounded-none max-sm:border-0 max-sm:ring-0">
          
          {/* iOS Dynamic Island */}
          <div className="absolute top-3 left-1/2 -translate-x-1/2 w-28 h-6 bg-black rounded-full z-50 flex items-center justify-between px-3.5 max-sm:hidden">
            <span className="w-1.5 h-1.5 rounded-full bg-zinc-900 shadow-[inset_0_1px_2px_rgba(255,255,255,0.2)]"></span>
            <span className="w-1.5 h-1.5 rounded-full bg-blue-900/60 shadow-[inset_0_1px_2px_rgba(0,0,0,0.8)]"></span>
            <span className="w-1 h-1 rounded-full bg-green-500/80 animate-pulse"></span>
          </div>

          {/* iOS Status Bar */}
          <div className="h-11 px-6 pt-3.5 flex items-center justify-between text-[11px] font-bold text-zinc-400 z-40 bg-zinc-950/20 backdrop-blur-sm select-none max-sm:hidden flex-shrink-0">
            <span>09:41</span>
            <div className="flex items-center gap-1.5">
              <svg className="w-3.5 h-3" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3c-1.2 0-2.4.2-3.6.7L12 12l3.6-8.3c-1.2-.5-2.4-.7-3.6-.7zm0 18c4.4 0 8-3.6 8-8s-3.6-8-8-8-8 3.6-8 8 3.6 8 8 8zm0-14.5c3.6 0 6.5 2.9 6.5 6.5s-2.9 6.5-6.5 6.5S5.5 14.6 5.5 11s2.9-6.5 6.5-6.5z"/></svg>
              <svg className="w-3.5 h-3" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21l-12-12c4.4-4.4 10.4-6.8 16.8-6.8s12.4 2.4 16.8 6.8l-12 12zm0-4.8l8.4-8.4c-2.4-2.4-5.4-3.6-8.4-3.6s-6 1.2-8.4 3.6l8.4 8.4z"/></svg>
              <div className="w-5 h-2.5 rounded-sm border border-zinc-500 p-[1px] flex items-center">
                <div className="h-full w-4/5 bg-zinc-300 rounded-2xs"></div>
              </div>
            </div>
          </div>

          {/* Core App View */}
          <div className="flex-1 flex flex-col justify-between overflow-y-auto no-scrollbar relative bg-zinc-950 text-zinc-100 bg-grid-overlay bg-glow-pink bg-glow-blue pb-24">
            
            {/* Header */}
            <header className="pt-6 pb-4 px-5 border-b border-zinc-900/60 flex items-center justify-between sticky top-0 bg-zinc-950/80 backdrop-blur-lg z-30 max-sm:pt-[calc(env(safe-area-inset-top,0px)+16px)]">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-purple-600 via-pink-500 to-blue-500 p-[1.5px] shadow-lg">
                  <div className="w-full h-full bg-zinc-950 rounded-[14px] flex items-center justify-center">
                    <span className="font-extrabold text-sm tracking-widest bg-gradient-to-r from-pink-400 to-blue-400 bg-clip-text text-transparent">CoFi</span>
                  </div>
                </div>
                <div>
                  <h1 className="font-extrabold text-base tracking-wide">CoFi 家庭聯名帳本</h1>
                  <p className="text-[10px] text-zinc-400 font-medium tracking-wider">BU 🐟 ✕ CHU 🦦 WAR ROOM</p>
                </div>
              </div>

              <div className="flex items-center gap-2 font-bold">
                <button 
                  onClick={() => setSheet({ isOpen: true, type: 'settings', data: null })}
                  className="w-7 h-7 rounded-lg bg-zinc-900 border border-zinc-800 text-zinc-400 flex items-center justify-center hover:text-purple-400 hover:border-purple-500/30 transition-all active-press"
                  title="跨裝置資料同步與備份"
                >
                  <Icon name="Settings" size={14} />
                </button>
                <div className="flex gap-1">
                  <span className="px-1.5 py-0.5 rounded-full bg-pink-500/10 border border-pink-500/30 text-[9px] text-pink-400">Bu 🐟</span>
                  <span className="px-1.5 py-0.5 rounded-full bg-blue-500/10 border border-blue-500/30 text-[9px] text-blue-400">Chu 🦦</span>
                </div>

            </header>

            {/* Main scrollable section */}
            <main className="flex-1 overflow-y-auto px-4 py-4 no-scrollbar">
              
              {/* Dashboard */}
              {activeTab === 'dashboard' && (
                <div className="space-y-5 animate-fadeIn">
                  <div className="premium-card rounded-2xl p-5 relative overflow-hidden bg-gradient-to-b from-zinc-900/90 to-zinc-950/90">
                    <div className="absolute top-0 right-0 w-24 h-24 bg-gradient-to-bl from-amber-500/10 to-transparent rounded-full filter blur-xl"></div>
                    <p className="text-[11px] font-bold text-zinc-400 tracking-wider flex items-center gap-1">
                      💰 合併家庭總資產
                      <span className="text-[9px] bg-amber-500/10 border border-amber-500/20 text-amber-400 px-1.5 py-0.2 rounded-full font-bold">月底定期盤點</span>
                    </p>
                    <div className="flex items-baseline gap-1 mt-2">
                      <span className="text-3xl font-extrabold bg-gradient-to-r from-amber-200 via-yellow-400 to-amber-300 bg-clip-text text-transparent tracking-tight">
                        ${Math.round(familyTotalAssets).toLocaleString()}
                      </span>
                      <span className="text-xs text-zinc-500 font-bold">TWD</span>
                    </div>

                        const cost = stk.shares * stk.avgCost;
                        const val = stk.shares * stk.currentPrice;
                        const profit = val - cost;
                        const pct = cost > 0 ? (profit / cost) * 100 : 0;
                        return (
                          <div key={stk.id} className={"premium-card rounded-xl p-3.5 flex justify-between items-center border-zinc-800/80 relative overflow-hidden " + (stk.owner === 'Bu' ? 'premium-card-pink' : 'premium-card-blue')}>
                            <div className="space-y-1">
                              <div className="flex items-center gap-1.5">
                                <span className="text-xs font-black text-zinc-100">{stk.symbol}</span>
                                <span className="text-[10px] text-zinc-400 font-bold">{stk.name}</span>
                                <span className="text-[8px] font-black">{stk.owner}</span>
                              </div>
                              <div className="flex gap-4 text-[10px] text-zinc-400">
                                <span>股數: {stk.shares}</span>
                                <span>成本: ${stk.avgCost}</span>
                                <span>現價: ${stk.currentPrice}</span>
                              </div>
                            </div>
                            <div className="flex flex-col items-end gap-1">
                              <p className="text-xs font-black">${Math.round(val).toLocaleString()}</p>
                              <p className={`text-[9px] font-bold ${profit >= 0 ? 'text-green-400' : 'text-red-400'}`}>{profit >= 0 ? '+' : ''}${Math.round(profit).toLocaleString()} ({profit >= 0 ? '+' : ''}{pct.toFixed(1)}%)</p>
                              <button onClick={() => handleStockDelete(stk.id)} className="text-zinc-600 hover:text-red-400"><Icon name="Trash2" size={11} /></button>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                </div>
              )}

            </main>

            {/* Bottom Navigation Dock */}
            <nav className="absolute bottom-0 left-0 right-0 bg-zinc-900/80 backdrop-blur-xl border-t border-zinc-800/80 px-4 pt-3 pb-7 flex justify-around z-30 shadow-2xl">
              <button onClick={() => setActiveTab('dashboard')} className={"flex flex-col items-center gap-1 transition-all " + (activeTab === 'dashboard' ? 'text-purple-400 scale-105' : 'text-zinc-400')}>
                <Icon name="Home" size={20} /><span className="text-[10px] font-extrabold tracking-wide">💰 大盤</span>
              </button>
              <button onClick={() => setActiveTab('hustle')} className={"flex flex-col items-center gap-1 transition-all " + (activeTab === 'hustle' ? 'text-purple-400 scale-105' : 'text-zinc-400')}>
                <Icon name="ShoppingBag" size={20} /><span className="text-[10px] font-extrabold tracking-wide">🛍 好物推推</span>
              </button>
              <button onClick={() => setActiveTab('cashflow')} className={"flex flex-col items-center gap-1 transition-all " + (activeTab === 'cashflow' ? 'text-purple-400 scale-105' : 'text-zinc-400')}>
                <Icon name="Landmark" size={20} /><span className="text-[10px] font-extrabold tracking-wide">🏦 收支對帳</span>
              </button>
              <button onClick={() => setActiveTab('stocks')} className={"flex flex-col items-center gap-1 transition-all " + (activeTab === 'stocks' ? 'text-purple-400 scale-105' : 'text-zinc-400')}>
                <Icon name="TrendingUp" size={20} /><span className="text-[10px] font-extrabold tracking-wide">📈 證券投資</span>
              </button>
            </nav>

            {/* Toast Container */}
            <div className="absolute top-20 left-0 right-0 px-5 flex flex-col gap-2 z-50 pointer-events-none max-w-xs mx-auto">
              {toasts.map(t => (
                <div key={t.id} onClick={() => removeToast(t.id)} className={"pointer-events-auto p-3 rounded-xl border shadow-xl flex items-center justify-between gap-3 text-xs font-bold transition-all transform animate-slideIn " + (t.type === 'success' ? 'bg-zinc-900/90 text-green-400 border-green-500/30' : t.type === 'error' ? 'bg-zinc-900/90 text-red-400 border-red-500/30' : 'bg-zinc-900/90 text-purple-400 border-purple-500/30')}>
                  <span>{t.message}</span><button className="text-zinc-500"><Icon name="X" size={12} /></button>
                </div>
              ))}
            </div>

            {/* Confirmation Modal */}
            {modal.isOpen && (
              <div className="absolute inset-0 bg-black/75 backdrop-blur-sm z-50 flex items-center justify-center px-6 animate-fadeIn">
                <div className="bg-zinc-900 border border-zinc-800 rounded-2xl w-full max-w-xs p-5 shadow-2xl space-y-4">
                  <div className="flex items-center gap-2 text-yellow-500">
                    <Icon name="AlertTriangle" size={18} />
                    <h4 className="font-extrabold text-sm text-zinc-100">{modal.title}</h4>
                  </div>
                  <p className="text-xs text-zinc-400 leading-relaxed font-semibold">{modal.message}</p>
                  <div className="flex gap-2.5 pt-1">
                    <button onClick={() => setModal({ isOpen: false, title: '', message: '', onConfirm: null })} className="flex-1 py-2 bg-zinc-800 border border-zinc-700 text-zinc-300 rounded-lg text-xs font-extrabold">取消</button>
                    <button onClick={modal.onConfirm} className="flex-1 py-2 bg-red-600 text-white rounded-lg text-xs font-black shadow-lg">確認</button>
                  </div>
                </div>
              </div>
            )}

            {/* Bottom Sheet Drawer */}
            {sheet.isOpen && (
              <div className="absolute inset-0 bg-black/60 z-40 backdrop-blur-sm animate-fadeIn">
                <div className="absolute inset-0" onClick={() => setSheet({ isOpen: false, type: '', data: null })} />
                <div className="absolute bottom-0 left-0 right-0 max-w-md mx-auto bg-zinc-900 border-t border-zinc-800 rounded-t-3xl z-50 p-6 shadow-2xl flex flex-col max-h-[70vh] overflow-y-auto no-scrollbar animate-slideUp pb-8">
                  <div className="w-12 h-1 bg-zinc-700 rounded-full mx-auto mb-5" />
                  <div className="flex items-center justify-between mb-4">
                    <h3 className="font-extrabold text-sm text-zinc-200">
                      {sheet.type === 'reconcile' && "編輯與對帳校準 - " + (sheet.data ? sheet.data.name : "")}
                      {sheet.type === 'addAccount' && '🏦 新增日常對帳帳戶'}
                      {sheet.type === 'addOrder' && '🛍️ 新增手動 IG 訂單'}
                      {sheet.type === 'addTransaction' && '🏦 新增家庭日常記帳'}
                      {sheet.type === 'addStock' && '📈 新增證券股票持股'}
                      {sheet.type === 'excelImport' && '⚙️ Excel / 試算表快速匯入室'}
                      {sheet.type === 'addBatch' && '🛍️ 新增團購與代購檔期'}
                      {sheet.type === 'editOrder' && '🛍️ 編輯好物推推訂單'}
                    </h3>
                    <button onClick={() => setSheet({ isOpen: false, type: '', data: null })} className="p-1 rounded-full bg-zinc-800 text-zinc-400"><Icon name="X" size={14} /></button>
                  </div>
                  
                  {/* Form dispatch */}
                  <BottomSheetForm 
                    sheet={sheet} 
                    onSubmit={handleSheetSubmit} 
                    getFuzzyPriceMatches={getFuzzyPriceMatches} 
                    onExcelImport={handleExcelImport}
                    onAccountDelete={handleAccountDelete}
                    onClearOrders={handleClearOrders}
                    onClearTransactions={handleClearTransactions}
                    onSettingsImport={(payload) => {
                      setAccounts(payload.accounts);
                      setStocks(payload.stocks);
                      setBatches(payload.batches);
                      setOrders(payload.orders);
                      setTransactions(payload.transactions);
                      
                      // 確保同步更新當前選中的檔期 ID
                      if (Array.isArray(payload.batches) && payload.batches.length > 0) {
                        const active = payload.batches.find(b => b.active);
                        setSelectedBatchId(active ? active.id : payload.batches[0].id);
                      }
                      
                      showToast('⚡ 跨裝置資料同步成功！已完美載入。', 'success');
                      setSheet({ isOpen: false, type: '', data: null });
                    }}
                  />
                </div>
              </div>
            )}

          </div>

          {/* iOS Bottom Home Bar */}
          <div className="absolute bottom-2 left-1/2 -translate-x-1/2 w-32 h-1 bg-zinc-700 rounded-full z-40 max-sm:hidden" />

        </div>
      );
    }

    // Bottom Sheet Form routing
    function BottomSheetForm({ sheet, onSubmit, getFuzzyPriceMatches, onExcelImport, onSettingsImport, onAccountDelete, onClearOrders, onClearTransactions }) {
      const { type, data } = sheet;

      const [balance, setBalance] = useState(data ? data.balance : '');
      const [accName, setAccName] = useState(data ? data.name : '');
      const [accOwner, setAccOwner] = useState(data ? data.owner : '共同');
      const [accCurrency, setAccCurrency] = useState(data ? data.currency : 'TWD');

      const [orderForm, setOrderForm] = useState({
        client: '',
        date: new Date().toISOString().split('T')[0],
        item: '',
        unitCost: '',
        unitPrice: '',
        quantity: '1',
        costCurrency: 'VND', // 預設進貨是越南盾 (VND)
        priceCurrency: 'TWD' // 預設售價是台幣 (TWD)
      });
      const [priceSuggestions, setPriceSuggestions] = useState([]);

      useEffect(() => {
        if (type === 'editOrder' && data) {
          setOrderForm({
            client: data.client || '',
            date: data.date || new Date().toISOString().split('T')[0],
            item: data.item || '',
            unitCost: data.unitCost !== undefined ? data.unitCost : (data.cost / (data.quantity || 1)),
            unitPrice: data.unitPrice !== undefined ? data.unitPrice : (data.price / (data.quantity || 1)),
            quantity: data.quantity !== undefined ? String(data.quantity) : '1',
            costCurrency: data.costCurrency || 'VND',
            priceCurrency: data.priceCurrency || 'TWD'
          });
        }
      }, [type, data]);

      const [txForm, setTxForm] = useState({
        txType: 'expense', amount: '', currency: 'TWD', category: '餐飲伙食', owner: '共同', date: new Date().toISOString().split('T')[0], desc: ''
      });

      const [stockForm, setStockForm] = useState({
        symbol: '', name: '', shares: '', avgCost: '', currentPrice: '', owner: 'Chu'
      });

      const [batchForm, setBatchForm] = useState({
        name: '', active: true
      });

      // --- Excel 匯入表單專屬狀態 ---
      const [importYear, setImportYear] = useState('2026');
      const [excelText, setExcelText] = useState('');
      const [parsedPreview, setParsedPreview] = useState([]);

      // --- 設定與跨裝置同步專屬狀態 ---
      const [importCode, setImportCode] = useState('');
      const [copiedSync, setCopiedSync] = useState(false);

      const getExportCode = () => {
        try {
          const payload = {
            accounts: JSON.parse(localStorage.getItem('cofi_accounts') || '[]'),
            stocks: JSON.parse(localStorage.getItem('cofi_stocks') || '[]'),
            batches: JSON.parse(localStorage.getItem('cofi_batches') || '[]'),
            orders: JSON.parse(localStorage.getItem('cofi_orders') || '[]'),
            transactions: JSON.parse(localStorage.getItem('cofi_transactions') || '[]'),
            timestamp: Date.now()
          };
          return btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
        } catch (e) {
          return '';
        }
      };

      // 解析 Excel 貼上 TSV 資料的引擎
      const handleParseExcel = () => {
        if (!excelText.trim()) return;
        const lines = excelText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
        if (lines.length === 0) return;

        const parsedTxs = [];
        
        // A. 判定是否為您所屬的「花費項目 | Jan | Feb ...」月度總表格式
        const isMonthlyMatrix = lines[0].toLowerCase().indexOf('jan') !== -1 || lines[0].toLowerCase().indexOf('feb') !== -1 || lines[0].toLowerCase().indexOf('mar') !== -1;

        if (isMonthlyMatrix) {
          const headers = lines[0].split('\t').map(h => h.trim());
          const months = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];
          const monthCols = [];
          
          headers.forEach((h, idx) => {
            const matchIdx = months.indexOf(h.toLowerCase());
            if (matchIdx !== -1) monthCols.push({ monthIdx: matchIdx, colIndex: idx });
          });

          for (let i = 1; i < lines.length; i++) {
            const parts = lines[i].split('\t').map(p => p.trim());
            if (parts.length === 0 || !parts[0]) continue;
            
            const itemName = parts[0];
            if (
              itemName.toLowerCase() === 'total' || 
              itemName.includes('存入總額') || 
              itemName.includes('達標率') || 
              itemName.includes('新水總額')
            ) continue;

            const isIncome = itemName.includes('薪水') || itemName.includes('配息') || itemName.includes('賺取') || itemName.includes('代購賺') || itemName.includes('收入');
            
            let owner = '共同';
            if (itemName.includes('Bu') || itemName.includes('代購') || itemName.includes('🐈')) owner = 'Bu'; 
            if (itemName.includes('Chu')) owner = 'Chu';

            let category = '其他';
            if (itemName.includes('房貸') || itemName.includes('裝潢') || itemName.includes('電費') || itemName.includes('水電') || itemName.includes('電信')) category = '住宅房租';
            else if (itemName.includes('生活費') || itemName.includes('餐') || itemName.includes('伙食')) category = '餐飲伙食';
            else if (itemName.includes('車') || itemName.includes('交通') || itemName.includes('貸款')) category = '交通移動';
            else if (itemName.includes('保養') || itemName.includes('治裝') || itemName.includes('旅遊') || itemName.includes('休閒') || itemName.includes('娛樂') || itemName.includes('紅包') || itemName.includes('禮品')) category = '娛樂生活';
            else if (itemName.includes('薪水') || itemName.includes('薪資')) category = '主業薪資';
            else if (itemName.includes('代購') || itemName.includes('副業')) category = '副業滾存';

            monthCols.forEach(col => {
              if (col.colIndex < parts.length) {
                const valStr = parts[col.colIndex];
                if (valStr && valStr.trim() !== '') {
                  const cleanVal = parseFloat(valStr.replace(/[$,\s]/g, ''));
                  if (!isNaN(cleanVal) && cleanVal !== 0) {
                    const mStr = String(col.monthIdx + 1).padStart(2, '0');
                    parsedTxs.push({
                      id: `excel_matrix_${i}_${col.monthIdx}_` + Date.now(),
                      date: `${importYear}-${mStr}-28`, 
                      type: isIncome ? 'income' : 'expense',
                      amount: cleanVal,
                      category,
                      owner,
                      desc: itemName + " (歷史Excel匯入)"
                    });
                  }
                }
              }
            });
          }
        } else {
          // B. 流水明細帳 (格式：日期\t類型\t金額\t分類\t擁有者\t備註)
          lines.forEach((line, idx) => {
            const parts = line.split('\t').map(p => p.trim());
            if (parts.length < 3) return;
            
            const date = parts[0];
            const typeStr = parts[1];
            const amount = parseFloat(parts[2].replace(/[$,\s]/g, ''));
            const category = parts[3] || '其他';
            const owner = parts[4] || '共同';
            const desc = parts[5] || '';

            if (date && !isNaN(amount)) {
              const type = (typeStr === '收入' || typeStr === 'income') ? 'income' : 'expense';
              parsedTxs.push({
                id: 'excel_tsv_' + idx + '_' + Date.now(),
                date: date.indexOf('-') !== -1 ? date : new Date(date).toISOString().split('T')[0],
                type,
                amount,
                category,
                owner,
                desc
              });
            }
          });
        }

        setParsedPreview(parsedTxs);
      };

      const handleItemNameChange = (e) => {
        const val = e.target.value;
        setOrderForm(prev => Object.assign({}, prev, { item: val }));
        setPriceSuggestions(getFuzzyPriceMatches(val));
      };

      const applySuggestion = (sug) => {
        setOrderForm(prev => Object.assign({}, prev, { 
          item: sug.item, 
          unitCost: sug.unitCost, 
          unitPrice: sug.unitPrice,
          costCurrency: sug.costCurrency || 'VND',
          priceCurrency: sug.priceCurrency || 'TWD'
        }));
        setPriceSuggestions([]);
      };

      switch (type) {
        case 'reconcile':
          return (
            <form onSubmit={(e) => onSubmit(e, { name: accName, owner: accOwner, balance, currency: accCurrency })} className="space-y-4 text-left">
              <div>
                <label className="text-[10px] font-bold text-zinc-400 block mb-1">帳戶名稱 *</label>
                <input type="text" required value={accName} onChange={(e) => setAccName(e.target.value)} className="w-full px-3.5 py-2 bg-zinc-950 border border-zinc-800 text-xs font-bold text-zinc-100 rounded-xl outline-none" placeholder="編輯帳戶名稱" />
              </div>
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="text-[10px] font-bold text-zinc-400 block mb-1">持有者 *</label>
                  <select value={accOwner} onChange={(e) => setAccOwner(e.target.value)} className="w-full px-2.5 py-2 bg-zinc-950 border border-zinc-800 text-xs font-bold text-zinc-200 rounded-xl outline-none">
                    <option value="共同">共同 🤝</option>
                    <option value="Bu">Bu 🐟 (妻)</option>
                    <option value="Chu">Chu 🦦 (夫)</option>
                  </select>
                </div>
                <div>
                  <label className="text-[10px] font-bold text-zinc-400 block mb-1">對帳幣別 *</label>
                  <select value={accCurrency} onChange={(e) => setAccCurrency(e.target.value)} className="w-full px-2.5 py-2 bg-zinc-950 border border-zinc-800 text-xs font-bold text-zinc-200 rounded-xl outline-none">
                    <option value="TWD">台幣 (TWD)</option>
                    <option value="USD">美金 (USD)</option>
                    <option value="VND">越南盾 (VND)</option>
                  </select>
                </div>
              </div>
              <div>
                <label className="text-[10px] font-bold text-zinc-400 block mb-1">年底網銀餘額 ({CURRENCY_SYMBOLS[accCurrency] || '$'}) *</label>
                <input type="number" required value={balance} onChange={(e) => setBalance(e.target.value)} className="w-full px-3.5 py-2 bg-zinc-950 border border-zinc-800 text-xs font-bold text-zinc-100 rounded-xl outline-none" placeholder="網銀即時餘額" />
              </div>
              <div className="flex gap-2.5 pt-1">
                <button 
                  type="button" 
                  onClick={() => {
                    if (confirm(`確定要刪除帳戶「${data.name}」嗎？這將不會影響您的歷史流水帳目，但會將該帳戶自餘額盤點中移除。`)) {
                      onAccountDelete(data.id);
                    }
                  }} 
                  className="flex-1 py-2 bg-red-950/40 border border-red-500/30 text-red-400 font-extrabold text-xs rounded-xl hover:bg-red-900/30 active-press"
                >
                  🗑️ 刪除此帳戶
                </button>
                <button type="submit" className="flex-1 py-2 bg-gradient-to-r from-purple-500 to-indigo-600 text-white font-extrabold text-xs rounded-xl shadow-lg active-press">儲存更變</button>
              </div>
            </form>
          );

        case 'addAccount':
          return (
            <form onSubmit={(e) => onSubmit(e, { name: accName, owner: accOwner, balance, currency: accCurrency })} className="space-y-3.5 text-left">
              <div>
                <label className="text-[10px] font-bold text-zinc-400 block mb-1">帳戶名稱 *</label>
                <input type="text" required value={accName} onChange={(e) => setAccName(e.target.value)} className="w-full px-3.5 py-2 bg-zinc-950 border border-zinc-800 text-xs font-bold text-zinc-100 rounded-xl outline-none" placeholder="例如：國泰世華、郵局、現金袋" />
              </div>
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="text-[10px] font-bold text-zinc-400 block mb-1">持有者 *</label>
                  <select value={accOwner} onChange={(e) => setAccOwner(e.target.value)} className="w-full px-2.5 py-2 bg-zinc-950 border border-zinc-800 text-xs font-bold text-zinc-200 rounded-xl outline-none">
                    <option value="共同">共同 🤝</option>
                    <option value="Bu">Bu 🐟 (妻)</option>
                    <option value="Chu">Chu 🦦 (夫)</option>
                  </select>
                </div>
                <div>
                  <label className="text-[10px] font-bold text-zinc-400 block mb-1">對帳幣別 *</label>
                  <select value={accCurrency} onChange={(e) => setAccCurrency(e.target.value)} className="w-full px-2.5 py-2 bg-zinc-950 border border-zinc-800 text-xs font-bold text-zinc-200 rounded-xl outline-none">
                    <option value="TWD">台幣 (TWD)</option>
                    <option value="USD">美金 (USD)</option>
                    <option value="VND">越南盾 (VND)</option>
                  </select>
                </div>
              </div>
              <div>
                <label className="text-[10px] font-bold text-zinc-400 block mb-1">初始餘額 ({CURRENCY_SYMBOLS[accCurrency] || '$'}) *</label>
                <input type="number" required value={balance} onChange={(e) => setBalance(e.target.value)} className="w-full px-3.5 py-2 bg-zinc-950 border border-zinc-800 text-xs font-bold text-zinc-100 rounded-xl outline-none" placeholder="輸入當前金額" />
              </div>
              <button type="submit" className="w-full py-2.5 bg-gradient-to-r from-purple-500 to-indigo-600 text-white font-extrabold text-xs rounded-xl shadow-lg active-press mt-2">建立新帳戶</button>
            </form>
          );

        case 'addOrder':
        case 'editOrder':
          return (
            <form onSubmit={(e) => onSubmit(e, orderForm)} className="space-y-3.5">
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="text-[10px] font-bold text-zinc-400 block mb-1">客戶姓名 *</label>
                  <input type="text" required value={orderForm.client} onChange={(e) => setOrderForm(prev => Object.assign({}, prev, { client: e.target.value }))} className="w-full px-3.5 py-2 bg-zinc-950 border border-zinc-800 text-xs font-bold text-zinc-100 rounded-xl outline-none" placeholder="王小明" />
                </div>
                <div>
                  <label className="text-[10px] font-bold text-zinc-400 block mb-1">下單日期</label>
                  <input type="date" value={orderForm.date} onChange={(e) => setOrderForm(prev => Object.assign({}, prev, { date: e.target.value }))} className="w-full px-3 py-2 bg-zinc-950 border border-zinc-800 text-xs text-zinc-100 rounded-xl" />
                </div>
              </div>
              <div className="grid grid-cols-2 gap-3">
                <div className="col-span-2">
                  <label className="text-[10px] font-bold text-zinc-400 block mb-1">購買品項與名稱 *</label>
                  <input type="text" required value={orderForm.item} onChange={handleItemNameChange} className="w-full px-3.5 py-2 bg-zinc-950 border border-zinc-800 text-xs font-bold text-zinc-100 rounded-xl outline-none" placeholder="去皮腰果500g" />

    // ==========================================
    function PackingListPanel({ orders }) {
      const [isOpen, setIsOpen] = useState(false);

      const packingData = useMemo(() => {
        const counts = {};
        orders.forEach(o => {
          const name = o.item || '未命名商品';
          const q = o.quantity || 1;
          if (!counts[name]) {
            counts[name] = { total: 0, pending: 0, bought: 0, shipped: 0 };
          }
          counts[name].total += q;
          if (o.status === '待買項目') counts[name].pending += q;
          else if (o.status === '已買項目') counts[name].bought += q;
          else if (o.status === '已出貨') counts[name].shipped += q;
        });
        return Object.entries(counts).map(([name, data]) => ({ name, ...data }));
      }, [orders]);

      if (packingData.length === 0) return null;

      return (
        <div className="premium-card rounded-xl p-3 border-purple-500/10 space-y-2">
          <button 
            type="button"
            onClick={() => setIsOpen(!isOpen)}
            className="w-full flex items-center justify-between text-xs font-black text-purple-300 active-press outline-none"
          >
            <span className="flex items-center gap-1.5">📦 本期出貨品項累計盤點 ({packingData.length} 種)</span>
            <span className="text-[10px] bg-purple-500/10 px-2 py-0.5 rounded border border-purple-500/20 text-purple-400">
              {isOpen ? '收合' : '展開盤點'}
            </span>
          </button>

          {isOpen && (
            <div className="pt-2 border-t border-zinc-800/80 space-y-1.5 animate-fadeIn max-h-[180px] overflow-y-auto no-scrollbar">
              {packingData.map((item, idx) => (
                <div key={idx} className="flex flex-col gap-0.5 py-1 px-1.5 rounded bg-zinc-950/40 border border-zinc-900/60 text-[10px]">
                  <div className="flex justify-between items-center font-bold">
                    <span className="text-zinc-200">{item.name}</span>
                    <span className="text-purple-400 font-extrabold">共 {item.total} 件</span>
                  </div>
                  <div className="flex gap-3 text-[9px] text-zinc-500 font-semibold">
                    <span className={item.pending > 0 ? 'text-yellow-400/80 font-black' : ''}>待買: {item.pending}</span>
                    <span className={item.bought > 0 ? 'text-blue-400/80 font-black' : ''}>已買: {item.bought}</span>
                    <span className={item.shipped > 0 ? 'text-green-400/80 font-black' : ''}>已出貨: {item.shipped}</span>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    // Mount application
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
